[project]
name = "monitory"
version = "0.1.0"
description = "Terminal system resource monitor, no GUI, with adaptive layout."
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
]

[project.scripts]
monitory = "monitory.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["monitory"]
